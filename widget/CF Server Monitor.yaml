# ====================================
# 📌 模块名称: CF Server Monitor 小组件（公开模板）
# ✨ 主要功能: 实时监控服务器在线状态、CPU/内存/硬盘占用、月度流量进度及实时上下行速率
# 🔀 多服务器: 「CF 服务器 1~6」每个组件绑一台（由 SERVER_1~6 指定），「CF 全部服务器」一个大组件列出多台
# 🔒 隐私安全: 本文件不含任何私人域名、服务器 ID 或密钥，所有隐私参数均在 Egern App 内填写，仅保存在本地设备
# ⚠️ 注意: env_schema 的 default_value 只是输入框占位提示，不会自动写入 env，必须在模块设置里手动填写
# 📖 适配文档: https://egernapp.com/docs/configuration/widgets/
# ====================================

name: "CF Server Monitor"
description: "CF-Server-Monitor 探针状态监控小组件。支持多服务器：可给每个桌面组件绑定不同服务器，或用一个组件总览全部。"

# 说明：模块文件的自动更新周期不在这里配置。auto_update 只属于 Profile.yaml；
# 模块更新周期请写在引用该模块的 modules 配置中，例如：
#   modules:
#     - url: "https://raw.githubusercontent.com/its-rory/Egern-widget/refs/heads/main/widget/CF%20Server%20Monitor.yaml"
#       update_interval: 3600

env_schema:
  BASE_URL:
    name: 🌐 监控面板地址 (必填)
    description: "在 Egern 本地填写你的 CF-Server-Monitor 域名（末尾无需斜杠）"
    default_value: "https://status.example.com"
  SERVER_ID:
    name: 🖥️ 服务器名称或 ID (默认组件用)
    description: "支持直接填写服务器名称（如 CloudCone）、UUID，或填 1 自动取第 1 台服务器"
    default_value: "CloudCone"
  SERVER_1:
    name: 🧩 槽位 1 的服务器
    description: "「CF 服务器 1」小组件显示哪台：填服务器名称（如 CloudCone）或 UUID；留空则按面板顺序取第 1 台"
    default_value: ""
  SERVER_2:
    name: 🧩 槽位 2 的服务器
    description: "「CF 服务器 2」小组件显示哪台：填服务器名称或 UUID；留空则取第 2 台"
    default_value: ""
  SERVER_3:
    name: 🧩 槽位 3 的服务器
    description: "「CF 服务器 3」小组件显示哪台：填服务器名称或 UUID；留空则取第 3 台"
    default_value: ""
  SERVER_4:
    name: 🧩 槽位 4 的服务器
    description: "「CF 服务器 4」小组件显示哪台：填服务器名称或 UUID；留空则取第 4 台"
    default_value: ""
  SERVER_5:
    name: 🧩 槽位 5 的服务器
    description: "「CF 服务器 5」小组件显示哪台：填服务器名称或 UUID；留空则取第 5 台"
    default_value: ""
  SERVER_6:
    name: 🧩 槽位 6 的服务器
    description: "「CF 服务器 6」小组件显示哪台：填服务器名称或 UUID；留空则取第 6 台"
    default_value: ""
  PASSWORD:
    name: 🔑 私有站点密码 / API_SECRET (可选)
    description: "若面板关闭了公开访问或隐藏了服务器，填入后台密码或 API_SECRET；公开站点留空即可"
    default_value: ""
  USERNAME:
    name: 👤 私有站点用户名 (可选)
    description: "私有站点后台管理员用户名，未修改过请保持默认 admin"
    default_value: "admin"
  API_TOKEN:
    name: 🎫 私有站点 JWT Token (可选)
    description: "若不想填密码，也可直接填入 Bearer JWT Token（优先级高于密码）"
    default_value: ""

scriptings:
  - generic:
      name: "CF Server Monitor"
      script_url: "https://raw.githubusercontent.com/its-rory/Egern-widget/refs/heads/main/widget/cf_server_monitor.js"
      timeout: 20

widgets:
  # 默认单机组件：按 SERVER_ID 选服务器（留空 = 第一台）
  - name: "CF Server Monitor"
    script_name: "CF Server Monitor"

  # 多服务器：每个槽位一个组件，桌面加几个就能同时看几台。
  # 具体显示哪台由模块设置里的 SERVER_1 ... SERVER_6 决定，留空则按面板顺序取对应序号。
  - name: "CF 服务器 1"
    script_name: "CF Server Monitor"
    env:
      SLOT: "1"
  - name: "CF 服务器 2"
    script_name: "CF Server Monitor"
    env:
      SLOT: "2"
  - name: "CF 服务器 3"
    script_name: "CF Server Monitor"
    env:
      SLOT: "3"
  - name: "CF 服务器 4"
    script_name: "CF Server Monitor"
    env:
      SLOT: "4"
  - name: "CF 服务器 5"
    script_name: "CF Server Monitor"
    env:
      SLOT: "5"
  - name: "CF 服务器 6"
    script_name: "CF Server Monitor"
    env:
      SLOT: "6"

  # 总览：一个组件里列出多台（大尺寸最多 7 台，中尺寸 3 台）
  - name: "CF 全部服务器"
    script_name: "CF Server Monitor"
    env:
      MODE: "all"
