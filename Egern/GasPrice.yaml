# ==========================================
# 📌 模块名称: 全国油价 Widget
# ✨ 主要功能: 实时省市油价，等比例四宫格布局，内置历法精准倒数与趋势预判。
# 🔗 https://raw.githubusercontent.com/jnlaoshu/MySelf/master/Egern/Widget/GasPrice.yaml
# ⏱️ 2026.03.30 10:00
# ==========================================

name: "全国油价 Widget"
description: "实时抓取省市油价；深度结合第8/9工作日法则，智能切换本轮回顾与下轮趋势预测。"

auto_update:
  interval: 43200

env_schema:
  PROVINCE:
    name: 📍 省份名称
    description: "输入中文省份名称（如：江苏）或省份代码（如：32）"
    default_value: "江苏"
  CITY:
    name: 🏙️ 城市名称
    description: "输入中文城市名称（如：南京、苏州）"
    default_value: "南京"


scriptings:
  - generic:
      name: 全国油价
      script_url: https://raw.githubusercontent.com/jnlaoshu/MySelf/master/Egern/Widget/GasPrice.js

widgets:
  - name: 全国油价
    script_name: 全国油价
